<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>пупік</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .output {
            white-space: pre-wrap;
            font-family: monospace;
        }
    </style>
</head>

<body>
    <h1>FizzBuzz</h1>
    <p>Результат:</p>
    <div class="output" id="output"></div>

    <script>
       
        function fizzBuzz() {
            let output = ""; 
            for (let i = 1; i <= 100; i++) {
                if (i % 3 === 0 && i % 5 === 0) {
                    output += "FizzBuzz\n";
                } else if (i % 3 === 0) {
                    output += "Fizz\n";
                } else if (i % 5 === 0) {
                    output += "Buzz\n";
                } else {
                    output += i + "\n";
                }
            }
            return output;
        }
        document.getElementById("output").textContent = fizzBuzz();
    </script>
</body>

</html>
