<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обчислення факторіалу</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        input {
            padding: 5px;
            font-size: 16px;
        }

        button {
            padding: 5px 10px;
            font-size: 16px;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Обчислення факторіалу</h1>
    <p>Введіть число:</p>
    <input type="number" id="numberInput" placeholder="Введіть число">
    <button onclick="calculateFactorial()">Обчислити</button>
    <div class="result" id="result"></div>

    <script>
        
        function factorial(n) {
            if (n === 0 || n === 1) {
                return 1; 
            }
            let result = 1;
            for (let i = 2; i <= n; i++) {
                result *= i; 
            }
            return result;
        }

        function calculateFactorial() {
            const input = document.getElementById("numberInput").value;
            const number = parseInt(input, 10); 
            const resultElement = document.getElementById("result");

            if (isNaN(number) || number < 0) {
                resultElement.textContent = "Будь ласка, введіть коректне невід'ємне число.";
                return;
            }

            const factorialResult = factorial(number);
            resultElement.textContent = `${number}! = ${factorialResult}`;
        }
    </script>
</body>

</html>
