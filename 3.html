<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблиця множення</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        input {
            padding: 5px;
            font-size: 16px;
        }

        button {
            padding: 5px 10px;
            font-size: 16px;
            cursor: pointer;
        }

        .output {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <h1>Таблиця множення</h1>
    <p>Введіть число:</p>
    <input type="number" id="numberInput" placeholder="Введіть число">
    <button onclick="generateTable()">Показати таблицю</button>
    <div class="output" id="output"></div>

    <script>
        function generateTable() {
            const input = document.getElementById("numberInput").value;
            const number = parseInt(input, 10); 
            const outputElement = document.getElementById("output");

            outputElement.innerHTML = "";

            if (isNaN(number)) {
                outputElement.textContent = "Будь ласка, введіть коректне число.";
                return;
            }

            let table = "<ul>";
            for (let i = 1; i <= 10; i++) {
                table += `<li>${number} x ${i} = ${number * i}</li>`;
            }
            table += "</ul>";

            outputElement.innerHTML = table;
        }
    </script>
</body>

</html>
